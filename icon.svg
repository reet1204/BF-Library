<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>BF Block Public Library</title>
  <desc>Logo for BF Block Public Library, Salt Lake, Kolkata</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="bookface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="120" r="100" fill="#4f46e5" opacity="0.12"/>
  <circle cx="420" cy="400" r="120" fill="#7c3aed" opacity="0.10"/>
  <circle cx="400" cy="80" r="60" fill="#a78bfa" opacity="0.08"/>
  <circle cx="100" cy="420" r="70" fill="#4f46e5" opacity="0.08"/>

  <!-- Diagonal accent lines -->
  <line x1="0" y1="220" x2="512" y2="60" stroke="#a78bfa" stroke-width="0.75" opacity="0.15"/>
  <line x1="0" y1="300" x2="512" y2="140" stroke="#a78bfa" stroke-width="0.5" opacity="0.10"/>

  <!-- Book shadow -->
  <ellipse cx="256" cy="430" rx="120" ry="10" fill="#000" opacity="0.35"/>

  <!-- Book body -->
  <rect x="106" y="60" width="300" height="355" rx="6" fill="url(#bookface)"/>
  <rect x="106" y="60" width="300" height="355" rx="6" fill="none" stroke="#6d28d9" stroke-width="2" opacity="0.8"/>

  <!-- Spine -->
  <rect x="106" y="60" width="34" height="355" rx="6" fill="url(#spine)"/>
  <rect x="136" y="60" width="4" height="355" fill="#0d0a1f" opacity="0.5"/>

  <!-- Page edges -->
  <rect x="403" y="68" width="6" height="339" rx="2" fill="#e2e8f0" opacity="0.12"/>
  <rect x="408" y="72" width="4" height="331" rx="1" fill="#e2e8f0" opacity="0.07"/>

  <!-- Top sheen -->
  <rect x="140" y="60" width="266" height="90" rx="4" fill="#ffffff" opacity="0.03"/>

  <!-- Top rule -->
  <line x1="154" y1="90" x2="398" y2="90" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>

  <!-- BF text -->
  <text x="258" y="295"
    text-anchor="middle"
    font-family="'Trebuchet MS', Impact, sans-serif"
    font-size="148" font-weight="700"
    fill="url(#textgrad)"
    letter-spacing="-3">BF</text>

  <!-- Gold bar -->
  <rect x="168" y="312" width="176" height="5" rx="2.5" fill="url(#gold)"/>
  <rect x="210" y="321" width="92" height="2" rx="1" fill="#fde68a" opacity="0.4"/>

  <!-- LIBRARY label -->
  <text x="258" y="360"
    text-anchor="middle"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="13" font-weight="400"
    fill="#c4b5fd" letter-spacing="7">LIBRARY</text>

  <!-- Corner dots -->
  <circle cx="150" cy="400" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="160" cy="400" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="150" cy="78" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="160" cy="78" r="2" fill="#f59e0b" opacity="0.3"/>

  <!-- Spine text -->
  <text x="123" y="258"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="11" font-weight="700"
    fill="#e9d5ff" letter-spacing="3"
    transform="rotate(-90 123 258)">BF BLOCK</text>
</svg>
